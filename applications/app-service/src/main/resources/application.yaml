server:
  port: 8090
spring:
  application:
    name: "applications-service"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
routes:
  paths:
    applications: "${RESOURCE_APPLICATION}"
adapters:
  r2dbc:
    host: "${R2DBC_HOST}"
    port: 5432
    database: "${R2DBC_DATABASE}"
    schema: "${R2DBC_SCHEMA}"
    username: "${R2DBC_USERNAME}"
    password: "${R2DBC_PASSWORD}"
adapter:
  restconsumer:
    timeout: 5000
    url: "${CLIENT_USER_HOST}"
    path-find-user-by-document-number: "${CLIENT_USER_BY_DOCUMENT_NUMBER}"
    path-find-users-by-emails: "${CLIENT_USERS_BY_EMAILS}"
jwt:
  keystore-location: "${KEYSTORE_LOCATION}"
  keystore-password: "${KEYSTORE_PASSWORD}"
  key-alias: "${KEY_ALIAS}"

resilience4j:
  circuitbreaker:
    instances:
      getUsersByEmails:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      getUserByDocumentNumber:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
